name: mend
description: "Mend — campus incident reporting app for ALU students and Facilities staff."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Photo uploads (Cloudinary over HTTPS)
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # UI / utilities
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true